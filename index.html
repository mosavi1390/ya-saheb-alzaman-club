<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یا صاحب‌الزمان (عج) | باشگاه ورزشی</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #0b0e0d;
      color: #f1f6f2;
      text-align: center;
    }
    header {
      padding: 25px 12px;
      border-bottom: 1px solid #29332d;
    }
    h1 { color: #b7ff36; }
    main {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      background: #131816;
      border: 1px solid #29332d;
      border-radius: 18px;
      padding: 25px;
    }
    p { line-height: 2; color: #c5d0c8; }
    button {
      background: #b7ff36;
      color: #11160e;
      border: 0;
      border-radius: 10px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>یا صاحب‌الزمان (عج)</h1>
    <p>سامانه مدیریت باشگاه ورزشی</p>
  </header>

  <main>
    <div class="card">
      <h2>به باشگاه خوش آمدید 💚</h2>
      <p>
        مدیریت برنامه‌های تمرینی، حضور و غیاب،
        پیگیری پیشرفت و ارتباط مربی با ورزشکاران.
      </p>
      <button onclick="alert('به‌زودی فعال می‌شود!')">
        ورود به باشگاه
      </button>
    </div>
  </main>
</body>
</html>
